# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx1G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Environment Properties
# You can find the latest versions here: https://projects.neoforged.net/neoforged/neoforge
# The Minecraft version must agree with the Neo version to get a valid artifact
minecraft_version=26.1.2
# The Minecraft version range can use any release version of Minecraft as bounds.
# Snapshots, pre-releases, and release candidates are not guaranteed to sort properly
# as they do not follow standard versioning conventions.
minecraft_version_range=[26.1.2]
# The Neo version must agree with the Minecraft version to get a valid artifact
neo_version=26.1.2.109

## Compat Mods (opcionais)
# Curios: https://maven.theillusivec4.top/top/theillusivec4/curios/curios-neoforge/
curios_version=15.0.0+26.1.2
curios_version_range=[15.0.0,)
# Silent Gear / Silent Lib: https://modrinth.com/mod/silent-gear
silentgear_version=4.2.3
silentgear_version_range=[4.2,)
silentlib_version=11.2.0
# Apotheosis + Apothic Enchanting/Attributes (Shadows_of_Fire): https://modrinth.com/mod/apotheosis
# Só dados (gemas, estatísticas de mesa de encantamento) — nada para compilar.
apotheosis_version=26.1.2-9.1.0
apotheosis_version_range=[9.0,)
apothic_enchanting_version=26.1.2-2.0.0
apothic_enchanting_version_range=[2.0,)
apothic_attributes_version=26.1.2-3.0.1
apothic_spawners_version=26.1.2-2.0.1
placebo_version=26.1.2-10.0.2
patchouli_version=26.1-94-beta
# JEI: https://maven.blamejared.com/mezz/jei/ (receitas da Mesa de Escrita, Triturador e Rituais)
jei_version=29.47.0.109
jei_version_range=[29.0,)
# Productive Metalworks (só CurseForge): https://www.curseforge.com/minecraft/mc-mods/productive-metalworks
# Arquivo 26.1.2-1.17.1 = id 8764957 (Curse Maven: curse.maven:productive-metalworks-1184570:8764957). Precisa do Productive Lib.
productivemetalworks_version_range=[26.1.2-1.15.0,)

## Mod Properties

# The unique mod identifier for the mod. Must be lowercase in English locale. Must fit the regex [a-z][a-z0-9_]{1,63}
# Must match the String constant located in the main mod class annotated with @Mod.
mod_id=mistech
# The human-readable display name for the mod.
mod_name=Mistech
# The license of the mod. Review your options at https://choosealicense.com/. All Rights Reserved is the default.
mod_license=All Rights Reserved
# The mod version. See https://semver.org/
mod_version=1.0.0
# The group ID for the mod. It is only important when publishing as an artifact to a Maven repository.
# This should match the base package used for the mod sources.
# See https://maven.apache.org/guides/mini/guide-naming-conventions.html
mod_group_id=com.mistech.mistechmod
